name: Publish Mau Launcher
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "Mau Launcher ${GITHUB_REF_NAME}" --generate-notes --draft
  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run check
      - name: Build unsigned installers
        run: npx electron-builder --publish never
      - name: Upload installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS= read -r -d '' artifact; do
            gh release upload "${GITHUB_REF_NAME}" "$artifact" --repo "${GITHUB_REPOSITORY}" --clobber
          done < <(find dist -maxdepth 1 -type f \( -iname '*.exe' -o -iname '*.msi' -o -iname '*.dmg' -o -iname '*.pkg' -o -iname '*.AppImage' -o -iname '*.deb' -o -iname '*.rpm' \) -print0)
  finalize:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish validated release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false
